# For now this just does a clean build and start/stop the server because the test suites
# hang.  https://github.com/dylan-lang/http/issues/90

name: tests
run-name: "tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    # all branches
  pull_request:
    branches:
      - main
      - master

  # This enables the Run Workflow button on the Actions tab.
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dylan-lang/install-opendylan@v3

      - name: make install
        env:
          DYLAN: dylan-root
        run: |
          deft update
          make install

      - name: Run http-server --help
        run: |
          dylan-root/bin/http-server --help
